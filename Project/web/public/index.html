<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Home Control</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; }
    input, button, select { padding: 0.5rem; margin: 0.5rem 0; }
    section { margin-bottom: 2rem; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h1>Smart Home Control Panel</h1>

  <div id="login">
    <h2>Login</h2>
    <input type="text" id="username" placeholder="Username" required /><br />
    <input type="password" id="password" placeholder="Password" required /><br />
    <button onclick="login()">Log In</button>
    <p id="login-msg"></p>
  </div>

  <div id="controls" class="hidden">
    <h2>Device Controls</h2>

    <section>
      <h3>Add New Device</h3>
      <select id="device-type">
        <option value="lights">Light</option>
        <option value="thermostats">Thermostat</option>
        <option value="cameras">Camera</option>
      </select><br />
      <input type="text" id="device-location" placeholder="Location e.g. Bedroom" />
      <input type="text" id="device-ip" placeholder="IP e.g. 192.168.1.20" />
      <button onclick="addDevice()">Add Device</button>
    </section>


    <section>
      <h3>Lights</h3>
      <input type="text" id="light-ip" placeholder="Light IP e.g. 192.168.1.1" />
      <button onclick="controlLight('on')">Turn On</button>
      <button onclick="controlLight('off')">Turn Off</button>
      <button onclick="getLightStatus('on')">Check if On</button>
      <button onclick="getLightStatus('bulb')">Check Bulb</button>
      <button onclick="replaceBulb()">Replace Bulb</button>
      <button onclick="getLightStatus('full')">Full Status</button>
      <button onclick="deleteDevice('lights')">Delete Light</button>
    </section>

    <section>
      <h3>Thermostats</h3>
      <input type="text" id="thermo-ip" placeholder="Thermostat IP e.g. 192.168.2.1" /><br />
      <input type="number" id="temp-val" placeholder="Set Temperature" />
      <button onclick="controlThermo('on')">Turn On</button>
      <button onclick="controlThermo('off')">Turn Off</button>
      <button onclick="getThermoStatus('current')">Current Temp</button>
      <button onclick="getThermoStatus('desired')">Desired Temp</button>
      <button onclick="setTemperature()">Set Temp</button>
      <button onclick="getThermoStatus('full')">Full Status</button>
      <button onclick="deleteDevice('thermostats')">Delete Thermostat</button>
    </section>

    <section>
      <h3>Cameras</h3>
      <input type="text" id="camera-ip" placeholder="Camera IP e.g. 192.168.3.1" />
      <button onclick="controlCamera('on')">Turn On</button>
      <button onclick="controlCamera('off')">Turn Off</button>
      <button onclick="getCameraStatus('on')">Check if On</button>
      <button onclick="getCameraStatus('motion')">Motion Activated?</button>
      <button onclick="wipeMemory()">Wipe Memory</button>
      <button onclick="getCameraStatus('full')">Full Status</button>
      <button onclick="deleteDevice('cameras')">Delete Camera</button>
    </section>

    <p id="msg"></p>
  </div>

  <script>
    let currentUser = null;

    async function login() {
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      const res = await fetch('http://localhost:3000/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });

      const data = await res.json();
      document.getElementById('login-msg').innerText = data.message;

      if (data.message.includes("Succeeded")) {
        currentUser = username;
        document.getElementById('login').classList.add('hidden');
        document.getElementById('controls').classList.remove('hidden');
      }
    }

    async function addDevice() {
      const type = document.getElementById('device-type').value;
      const location = document.getElementById('device-location').value;
      const ip = document.getElementById('device-ip').value;
      if (!location || !ip || !currentUser) return;

      const res = await fetch(`http://localhost:3000/${type}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: currentUser, location, ip })
      });

      const data = await res.json();
      document.getElementById('msg').innerText = data.message || data.error;
    }

    function getIp(type) {
      return document.getElementById(`${type}-ip`).value;
    }

    async function controlLight(action) {
      await sendPut(`/lights/${getIp('light')}/${action}`);
    }

    async function getLightStatus(kind) {
      let route = kind === 'on' ? 'status/on' : kind === 'bulb' ? 'status/bulb' : 'status';
      await sendGet(`/lights/${getIp('light')}/${route}`);
    }

    async function replaceBulb() {
      await sendPut(`/lights/${getIp('light')}/bulb/replace`);
    }

    async function controlThermo(action) {
      await sendPut(`/thermostats/${getIp('thermo')}/${action}`);
    }

    async function getThermoStatus(kind) {
      const route = kind === 'current' ? 'temp/current' : kind === 'desired' ? 'temp/desired' : 'status';
      await sendGet(`/thermostats/${getIp('thermo')}/${route}`);
    }

    async function setTemperature() {
      const ip = getIp('thermo');
      const temperature = document.getElementById('temp-val').value;
      if (!ip || !temperature || !currentUser) return;

      const res = await fetch(`http://localhost:3000/thermostats/${ip}/set`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: currentUser, temperature })
      });

      const data = await res.json();
      document.getElementById('msg').innerText = data.message || data.error;
    }

    async function controlCamera(action) {
      await sendPut(`/cameras/${getIp('camera')}/${action}`);
    }

    async function getCameraStatus(kind) {
      let route = kind === 'on' ? 'status/on' : kind === 'motion' ? 'status/motion' : 'status';
      await sendGet(`/cameras/${getIp('camera')}/${route}`);
    }

    async function wipeMemory() {
      await sendPut(`/cameras/${getIp('camera')}/memory/wipe`);
    }

    async function deleteDevice(type) {
      const ip = getIp(type === 'lights' ? 'light' : type === 'thermostats' ? 'thermo' : 'camera');
      const res = await fetch(`http://localhost:3000/${type}/${ip}`, {
        method: 'DELETE',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: currentUser })
      });
      const data = await res.json();
      document.getElementById('msg').innerText = data.message || data.error;
    }

    async function sendPut(route) {
      const res = await fetch(`http://localhost:3000${route}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: currentUser })
      });
      const data = await res.json();
      document.getElementById('msg').innerText = data.message || data.error;
    }

    async function sendGet(route) {
      const res = await fetch(`http://localhost:3000${route}?username=${currentUser}`);
      const data = await res.json();
      document.getElementById('msg').innerText = data.message || data.error;
    }
  </script>
</body>
</html>
